services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: radar_test
      POSTGRES_USER: radar_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD must be set}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_test -d radar_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - radar_test_pgdata:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - radar_test_redisdata:/data

volumes:
  radar_test_pgdata:
  radar_test_redisdata:
